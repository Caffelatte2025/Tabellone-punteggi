name: Rilievi - APK Android

on:
  push:
    branches: [claude/app-gestione-rilievi-lgs-kh6ogo]
    paths: ['rilievi-app/**', '.github/workflows/rilievi-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rilievi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rilievi-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          RILIEVI_BUILD: ${{ github.run_number }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: Versione e firma fissa (così l'APK nuovo si installa sopra il vecchio)
        env:
          KS_B64: ${{ secrets.RILIEVI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RILIEVI_KEYSTORE_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('RILIEVI_BUILD') ?: '1')
                  versionName '1.' + (System.getenv('RILIEVI_BUILD') ?: '0')
              }
          }
          EOF
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rilievi.p12"
            cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  rilievi {
                      storeFile file(System.getenv('RILIEVI_KS'))
                      storePassword System.getenv('RILIEVI_KS_PASS')
                      keyAlias 'rilievi'
                      keyPassword System.getenv('RILIEVI_KS_PASS')
                      storeType 'pkcs12'
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.rilievi } }
          }
          EOF
            echo "Firma: chiave fissa Rilievi"
          else
            echo "::warning::Segreto RILIEVI_KEYSTORE_B64 assente: APK firmato con chiave di debug casuale (per aggiornare va disinstallato)"
          fi
      - name: Compila APK
        working-directory: rilievi-app/android
        env:
          RILIEVI_BUILD: ${{ github.run_number }}
          RILIEVI_KS: ${{ runner.temp }}/rilievi.p12
          RILIEVI_KS_PASS: ${{ secrets.RILIEVI_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Rilievi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rilievi-apk
          path: rilievi-app/Rilievi.apk
      - name: Pubblica come release (link diretto per il tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rilievi-apk
          name: Rilievi - ultima versione APK
          prerelease: true
          make_latest: false
          body: "APK di prova dell'app Rilievi, build ${{ github.run_number }}, compilata dal branch claude/app-gestione-rilievi-lgs-kh6ogo (commit ${{ github.sha }}). [build:${{ github.run_number }}]"
          files: rilievi-app/Rilievi.apk
